apiVersion: v1
kind: Service
metadata:
  name: ai-svc
  namespace: meeting-system
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
  selector:
    app: ai-agent
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-ingress
  namespace: meeting-system
spec:
  ingressClassName: haproxy # <-- ĐÃ SỬA TỪ NGINX THÀNH HAPROXY
  rules:
    - host: ai-meeting.co
      http:
        paths:
          - backend:
              service:
                name: ai-svc
                port:
                  number: 8000
            path: /
            pathType: Prefix